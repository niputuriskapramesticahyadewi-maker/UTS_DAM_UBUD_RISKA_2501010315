name: Akuisisi Data Ubud

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "UTS_DAM_UBUD_RISKA_2501010315_FINAL/scripts/akuisisi_data_ubud.py"
      - ".github/workflows/akuisisi-data.yml"
  schedule:
    - cron: "17 2 * * 1"

permissions:
  contents: write

jobs:
  akuisisi:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Siapkan Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "UTS_DAM_UBUD_RISKA_2501010315_FINAL/requirements.txt"

      - name: Instal dependensi
        run: |
          python -m pip install --upgrade pip
          pip install -r UTS_DAM_UBUD_RISKA_2501010315_FINAL/requirements.txt

      - name: Jalankan akuisisi dan pengolahan
        run: |
          python UTS_DAM_UBUD_RISKA_2501010315_FINAL/scripts/akuisisi_data_ubud.py

      - name: Simpan hasil ke GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add UTS_DAM_UBUD_RISKA_2501010315_FINAL/data UTS_DAM_UBUD_RISKA_2501010315_FINAL/metadata
          if git diff --cached --quiet; then
            echo "Tidak ada perubahan data untuk disimpan."
          else
            git commit -m "Simpan hasil akuisisi data Ubud otomatis"
            git pull --rebase origin main
            git push
          fi
